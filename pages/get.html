<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Lista de gadgets</title>
    <link rel="stylesheet" href="../css/get.css" />
    <script src="../js/get.js" defer></script>
  </head>
  <body>
    <header>
      <section>
      <h1>Lista de gadgets</h1>
      <p>Veja abaixo a lista de gadgets</p>
      </section>
      <p><a href="../index.html">Voltar para o cadastro</a></p>
    </header>
    <main>
      <section id="container-titulo-lista">
        <h2 id="titulo-lista">gadgets cadastrados</h2>
        <p>Os gadgets são exibidos automaticamente ao abrir a página</p>
        <p id="resposta"></p>
        <ul id="lista-gadgets"></ul>
      </section>
    </main>

    <!--Modelo para op JS copiar para cada gadget-->
    <template id="modelo-gadget">
      <li>
        <section class="card-capa">
          <img class="imagem-gadget" alt="" />
        </section>
        <section class="card-conteudo">
          <h3 class="nome"></h3>
          <p><strong>Modelo:</strong> <span class="title"> </span></p>
          <p><strong>Categoria:</strong> <span class="categoria"> </span></p>
          <p><strong>Marca:</strong> <span class="marca"> </span></p>
          <p><strong>Ano de lancamento:</strong> <span class="ano_lancamento"> </span></p>
          <p><strong>Preço:</strong> <span class="preco"> </span></p>
        </section>
      </li>
    </template>
  </body>
</html>
